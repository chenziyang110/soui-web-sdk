version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: [dependencies, ci]
    groups:
      compatible-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /sdk/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: [dependencies, web]
    groups:
      compatible-sdk-web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /templates/desktop-app/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: [dependencies, template]
    groups:
      compatible-template-web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /demos/workbench/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: [dependencies, demo]
    groups:
      compatible-demo-web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
