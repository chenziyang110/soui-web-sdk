<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SOUI Web SDK — Web 的表达力，C++ 的掌控力。</title>
  <desc id="description">TypeScript 界面经由 Bridge 连接 C++ 原生能力，提供兼容与现代两条桌面开发路径。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#FFF" stroke-opacity=".035"/></pattern>
    <linearGradient id="surface" x1="788" y1="124" x2="1155" y2="451" gradientUnits="userSpaceOnUse"><stop stop-color="#182A30"/><stop offset="1" stop-color="#10181E"/></linearGradient>
    <linearGradient id="signal" x1="715" y1="317" x2="1208" y2="317" gradientUnits="userSpaceOnUse"><stop stop-color="#79E6D2" stop-opacity="0"/><stop offset=".48" stop-color="#79E6D2"/><stop offset="1" stop-color="#79E6D2" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="600" rx="20" fill="#0B1117"/>
  <rect x="1" y="1" width="1278" height="598" rx="19" stroke="#26313B"/>
  <path d="M700 1H1260Q1279 1 1279 20V580Q1279 599 1260 599H700Z" fill="url(#grid)"/>
  <g font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(56 46)">
