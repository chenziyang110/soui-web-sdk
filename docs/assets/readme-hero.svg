    <text x="815" y="398" font-size="11" letter-spacing="1.8" fill="#79E6D2">METHODS / TASKS / EVENTS</text>
    <path d="M971 449V472" stroke="#79E6D2"/>
    <circle cx="971" cy="478" r="4" stroke="#79E6D2"/>
    <path d="M58 512H1222" stroke="#2A353E"/>
    <text x="58" y="548" font-size="12" letter-spacing="2" fill="#A3B4C1">ONE SDK. TWO RUNTIME PATHS.</text>
    <text x="1222" y="548" text-anchor="end" font-size="12" letter-spacing="1.5" fill="#79E6D2">MINIBLINK / WEBVIEW2</text>
