# Vendored OpenSSL demo/test identities are public upstream fixtures, not
# credentials used by this project. Keep this exclusion narrow so secret
# scanning remains active for all first-party code and other dependencies.
paths-ignore:
  - "third_party/sources/miniblink/node/openssl/openssl/apps/demoCA/**"
  - "third_party/sources/miniblink/node/openssl/openssl/apps/set/**"
  - "third_party/sources/miniblink/node/openssl/openssl/apps/*.pem"
  - "third_party/sources/miniblink/node/openssl/openssl/certs/demo/**"
  - "third_party/sources/miniblink/node/openssl/openssl/ms/key*.ss"
