<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InstalledRenewalProbe</title>
  <style>
    body{font:16px/1.5 "Microsoft YaHei",sans-serif;margin:24px;background:#f4f6f8;color:#172333}
    main{max-width:900px;margin:auto;background:white;padding:24px;border:1px solid #cbd3dc}
    h1{font-size:24px;margin:0 0 8px}p{margin:8px 0}.muted{color:#536173}
    .spinner{display:inline-block;width:18px;height:18px;margin-right:10px;border:3px solid #ccd6e0;border-top-color:#2569b0;border-radius:50%;animation:turn 1s linear infinite;vertical-align:middle}
    @keyframes turn{to{transform:rotate(360deg)}}
    #status{font-weight:bold}input{display:block;box-sizing:border-box;width:100%;padding:10px;font:inherit;margin:8px 0}
    pre{white-space:pre-wrap;overflow-wrap:break-word;font:14px/1.6 Consolas,monospace;background:#eef2f6;padding:14px;min-height:190px}
    .failed{color:#a21d23}.complete{color:#19613a}
  </style>
</head>
<body>
  <main>
    <h1>公共 SDK 同文档续期观察</h1>
    <p><span class="spinner" aria-hidden="true"></span><span id="status" role="status">等待原生连接</span></p>
    <p class="muted">本夹具验证任务、订阅与授权连续性；不替代 Workbench V02、真实呈现性能或生产验收。30 秒模式只检查夹具。</p>
    <label for="typing">可持续输入文字，观察窗口交互</label>
    <input id="typing" autocomplete="off" placeholder="在这里输入；测试期间不刷新页面" />
    <p id="interaction">输入事件 0 · 组合事件 0 · 窗口尺寸待记录</p>
    <pre id="details" aria-live="polite">初始化中…</pre>
  </main>
  <script type="module" src="/main.ts"></script>
</body>
</html>
