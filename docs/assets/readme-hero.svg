      <rect x="178" y="424" width="128" height="32" rx="5" fill="#121C25" stroke="#2B3A46"/>
      <text x="198" y="445" fill="#C4D2DD">WINDOWS</text>
      <rect x="318" y="424" width="128" height="32" rx="5" fill="#121C25" stroke="#2B3A46"/>
      <text x="337" y="445" fill="#C4D2DD">x86 / x64</text>
    </g>
    <path d="M756 180H1198M756 443H1198M789 124V476M1154 124V476" stroke="#263840" stroke-dasharray="3 7"/>
    <rect x="815" y="166" width="365" height="282" rx="13" fill="#0C141B" stroke="#334049"/>
