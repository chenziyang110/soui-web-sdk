name: Windows SDK verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: ${{ matrix.architecture }} / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/web/package-lock.json
            templates/desktop-app/web/package-lock.json
            demos/workbench/web/package-lock.json
      - name: Inspect toolchain
        shell: powershell
        run: ./tools/Doctor.ps1
      - name: Build SDK, template and Demo
        shell: powershell
        run: ./tools/Build.ps1 -Architecture ${{ matrix.architecture }} -Configuration ${{ matrix.configuration }}
      - name: Run unit and contract tests
        shell: powershell
        run: ./tools/Test.ps1 -Architecture ${{ matrix.architecture }} -Configuration ${{ matrix.configuration }} -UnitOnly
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.architecture }}-${{ matrix.configuration }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            out/**/*.json
            out/**/*.log
