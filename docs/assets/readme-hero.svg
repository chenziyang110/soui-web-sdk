      <path d="M22 9H12L9 13L22 19L19 23H9" stroke="#0B1117" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="bevel"/>
      <text x="46" y="22" font-size="16" font-weight="600" letter-spacing="2.8" fill="#D8E3E9">SOUI / WEB SDK</text>
    </g>
    <rect x="1090" y="47" width="134" height="30" rx="15" stroke="#3A5555"/>
    <circle cx="1107" cy="62" r="3" fill="#79E6D2"/>
    <text x="1120" y="67" font-size="12" letter-spacing="1.5" fill="#B7D8D3">PREVIEW</text>
    <text x="56" y="199" font-size="84" font-weight="750" letter-spacing="-4" fill="#F4F8FA">WEB MEETS</text>
    <text x="51" y="289" font-size="101" font-weight="750" letter-spacing="-4.5" fill="#79E6D2">NATIVE.</text>
    <text x="58" y="348" font-size="27" font-weight="500" fill="#E0E9EF">Web 的表达力，C++ 的掌控力。</text>
    <text x="58" y="386" font-size="17" fill="#92A6B5">把熟悉的前端，带到 Windows 桌面。</text>
    <g font-size="12" font-weight="600" letter-spacing="1.4">
      <rect x="58" y="424" width="108" height="32" rx="5" fill="#16242A" stroke="#31504E"/>
