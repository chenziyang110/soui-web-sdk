version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
  - package-ecosystem: npm
    directory: /sdk/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, web]
  - package-ecosystem: npm
    directory: /templates/desktop-app/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, template]
  - package-ecosystem: npm
    directory: /demos/workbench/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, demo]
