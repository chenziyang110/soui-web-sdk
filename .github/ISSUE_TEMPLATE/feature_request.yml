name: 功能建议
description: 提议可验证的 SDK、模板或维护能力
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体用户、场景和当前限制
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收条件
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API、兼容性和迁移影响
      description: 如涉及公共 API、Bridge、线程、系统或依赖，请说明
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已检查现有 Issue 和文档，没有发现重复项
          required: true
        - label: 我理解当前项目仍为 preview，生产门槛需单独验收
          required: true
