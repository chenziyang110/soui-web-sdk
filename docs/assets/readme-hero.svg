    <rect x="787" y="138" width="365" height="282" rx="13" fill="url(#surface)" stroke="#568477"/>
    <path d="M788 180H1152" stroke="#3A5557"/>
    <circle cx="809" cy="159" r="4" fill="#79E6D2"/>
    <circle cx="823" cy="159" r="4" fill="#3C595B"/>
    <circle cx="837" cy="159" r="4" fill="#3C595B"/>
    <text x="1109" y="163" font-size="10" letter-spacing="1.5" fill="#7D9A9F">UI</text>
    <text x="815" y="222" font-size="12" letter-spacing="2.4" fill="#9AB4B7">YOUR WEB INTERFACE</text>
    <text x="815" y="266" font-size="32" font-weight="650" letter-spacing="-1" fill="#ECF5F4">TypeScript</text>
    <text x="815" y="290" font-size="13" fill="#9CB3BB">Components. State. Interaction.</text>
